<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN | VDANN SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --bg: #0a0a0a; --red: #ff3e3e; --blue: #0099ff; }
        body { background: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace; padding: 20px; text-align: center; }
        .box { border: 1px solid var(--neon); padding: 20px; max-width: 600px; margin: 0 auto 20px; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        input, button, select { background: black; border: 1px solid var(--neon); color: var(--neon); padding: 10px; margin: 5px; outline: none; }
        button:hover { background: var(--neon); color: black; cursor: pointer; }
        .btn-copy { border-color: var(--blue); color: var(--blue); }
        .btn-copy:hover { background: var(--blue); color: white; }
        .btn-del { border-color: var(--red); color: var(--red); }
        .btn-del:hover { background: var(--red); color: white; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid var(--neon); padding: 10px; }
        .status-multi { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>VDANN ADMIN - KEY MANAGER</h1>
    
    <div class="box">
        <h3>TẠO KEY MỚI</h3>
        <input type="number" id="days" placeholder="Số ngày (VD: 1)" value="1" style="width: 80px;">
        <select id="keyType">
            <option value="lock">CHỈ 1 MÁY</option>
            <option value="multi">KHÔNG GIỚI HẠN MÁY</option>
        </select>
        <button onclick="createKey()">[ TẠO NGAY ]</button>
    </div>

    <div class="box" style="max-width: 800px;">
        <h3>DANH SÁCH KEY</h3>
        <table>
            <thead>
                <tr>
                    <th>KEY</th>
                    <th>HẠN DÙNG</th>
                    <th>LOẠI</th>
                    <th>THIẾT BỊ</th>
                    <th>THAO TÁC</th>
                </tr>
            </thead>
            <tbody id="keyTable"></tbody>
        </table>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIiLWiEDSnPGLqiUvxvGcCElljVGioW8I",
        authDomain: "vdann-app.firebaseapp.com",
        projectId: "vdann-app",
        storageBucket: "vdann-app.firebasestorage.app",
        messagingSenderId: "458475880895",
        appId: "1:458475880895:web:aa5f3193917e571d8d610a",
        databaseURL: "https://vdann-app-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Hàm tạo mã định danh máy (HWID)
    function generateHWID() {
        return btoa(navigator.userAgent + screen.width + navigator.language).substring(0, 16);
    }

    window.accessSystem = function() {
        const key = document.getElementById('keyInput').value.trim();
        const msg = document.getElementById('msg');
        const pBar = document.getElementById('pBar');
        const pCont = document.getElementById('pCont');
        const btn = document.getElementById('btnKey');
        const myHWID = generateHWID();

        if(!key) {
            msg.innerText = "LỖI: VUI LÒNG NHẬP MÃ!";
            return;
        }

        btn.disabled = true;
        pCont.style.display = 'block';
        let progress = 0;
        const interval = setInterval(() => {
            progress += 10;
            pBar.style.width = progress + "%";
            msg.innerText = "ĐANG XÁC THỰC: " + progress + "%";

            if(progress >= 100) {
                clearInterval(interval);
                
                // BẮT ĐẦU KIỂM TRA TRÊN FIREBASE
                get(ref(db, 'AllKeys/' + key)).then((snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        const now = Date.now();

                        // 1. Kiểm tra hạn dùng (Cả 2 loại key đều phải check cái này)
                        if (now > data.expires) {
                            msg.innerText = "TRUY CẬP BỊ TỪ CHỐI: KEY HẾT HẠN!";
                            btn.disabled = false;
                            return;
                        }

                        // 2. Kiểm tra loại Key và HWID
                        if (data.type === "multi" || data.hwid === "MULTI_DEVICE") {
                            // LOẠI KHÔNG GIỚI HẠN: Cho phép vào luôn
                            msg.innerText = "KEY ĐA MÁY - TRUY CẬP ĐƯỢC CHẤP NHẬN!";
                            setTimeout(() => window.location.href = "index.html", 1000);
                        } 
                        else {
                            // LOẠI KHÓA 1 THIẾT BỊ
                            if (data.hwid === "") {
                                // Lần đầu nhập -> Khóa máy này lại
                                update(ref(db, 'AllKeys/' + key), { hwid: myHWID }).then(() => {
                                    msg.innerText = "KÍCH HOẠT THÀNH CÔNG THIẾT BỊ!";
                                    setTimeout(() => window.location.href = "index.html", 1000);
                                });
                            } else if (data.hwid === myHWID) {
                                // Đúng máy đã khóa từ trước
                                msg.innerText = "THIẾT BỊ HỢP LỆ. ĐANG VÀO...";
                                setTimeout(() => window.location.href = "index.html", 1000);
                            } else {
                                // Máy khác nhập key đã bị khóa
                                msg.innerText = "LỖI: KEY ĐÃ LIÊN KẾT VỚI MÁY KHÁC!";
                                btn.disabled = false;
                                alert("CẢNH BÁO: Bạn không thể dùng key này trên máy khác!");
                            }
                        }
                    } else {
                        msg.innerText = "LỖI: KEY KHÔNG TỒN TẠI!";
                        btn.disabled = false;
                    }
                }).catch(err => {
                    msg.innerText = "LỖI KẾT NỐI DATABASE!";
                    btn.disabled = false;
                });
            }
        }, 50);
    }
</script>
</body>
</html>
