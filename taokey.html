<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN DASHBOARD</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root { --neon: #00ff41; --bg: #050505; --card: #0a0a0a; --red: #ff3e3e; }
        * { box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { background: var(--bg); color: var(--neon); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        h1 { font-family: 'Orbitron'; font-size: 20px; letter-spacing: 3px; text-shadow: 0 0 10px var(--neon); margin-bottom: 30px; }

        /* Stats Row */
        .stats-container { display: flex; gap: 15px; width: 100%; max-width: 900px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-card { flex: 1; min-width: 150px; background: var(--card); border: 1px solid #111; padding: 15px; text-align: center; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .stat-card span { display: block; font-size: 10px; color: #555; margin-bottom: 5px; }
        .stat-card b { font-family: 'Orbitron'; font-size: 18px; color: #fff; }

        /* Control Card */
        .card { background: var(--card); padding: 25px; border: 1px solid var(--neon); width: 100%; max-width: 900px; position: relative; box-shadow: 0 0 20px rgba(0,255,65,0.1); margin-bottom: 30px; }
        .grid-inputs { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; }
        
        input, select { background: #000; border: 1px solid #222; color: var(--neon); padding: 12px; outline: none; width: 100%; }
        input:focus { border-color: var(--neon); }
        
        label { display: block; font-size: 10px; color: #888; margin-bottom: 5px; }
        
        button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 12px 20px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
        .btn-clean { border-color: #ffb800; color: #ffb800; font-size: 10px; padding: 5px 15px; margin-bottom: 15px; }

        /* Table Style */
        .table-wrapper { width: 100%; max-width: 900px; overflow-x: auto; background: var(--card); border: 1px solid #111; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #000; color: #555; font-size: 11px; padding: 15px; text-align: left; text-transform: uppercase; border-bottom: 1px solid #111; }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid #0a0a0a; color: #ccc; }
        tr:hover { background: rgba(0,255,65,0.02); }

        /* Badges */
        .badge { padding: 2px 8px; border-radius: 2px; font-size: 10px; font-weight: bold; }
        .bg-green { background: rgba(0, 255, 65, 0.15); color: var(--neon); }
        .bg-red { background: rgba(255, 62, 62, 0.15); color: var(--red); }
        .bg-orange { background: rgba(255, 184, 0, 0.15); color: #ffb800; }

        .btn-del { color: var(--red); border: none; background: none; cursor: pointer; font-size: 11px; text-decoration: underline; }

        /* Modal Custom */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; }
        #h-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 101; width: 300px; background: #000; border: 1px solid var(--neon); padding: 20px; text-align: center; }
        .scan { position: absolute; top: 0; left: 0; width: 100%; height: 1px; background: var(--neon); animation: s 2s linear infinite; }
        @keyframes s { 0% {top:0} 100%{top:100%} }
    </style>
</head>
<body>

<h1>ADMIN_CONTROL_PANEL</h1>

<div class="stats-container">
    <div class="stat-card"><span>TỔNG KEY</span><b id="stat-total">0</b></div>
    <div class="stat-card"><span>KEY ĐÃ DÙNG</span><b id="stat-used">0</b></div>
    <div class="stat-card"><span>HẾT HẠN</span><b id="stat-expired">0</b></div>
</div>

<div class="card">
    <div class="grid-inputs">
        <div>
            <label>Tên Key / Mã định danh</label>
            <input id="keyIn" placeholder="VÍ DỤ: VIP-666">
        </div>
        <div>
            <label>Loại Key</label>
            <select id="typeIn" onchange="toggleDays()">
                <option value="ONCE">DÙNG 1 LẦN</option>
                <option value="TIME">THEO NGÀY</option>
                <option value="INFINITE">VĨNH VIỄN</option>
                <option value="LOCKED_ONCE">1 LẦN - 1 MÁY</option>
                <option value="LOCKED_TIME">NGÀY - 1 MÁY</option>
            </select>
        </div>
        <div id="daysBox" style="display:none;">
            <label>Số ngày</label>
            <input id="daysIn" type="number" value="1">
        </div>
        <button onclick="addKey()">[ PHÁT HÀNH ]</button>
    </div>
</div>

<div style="width: 100%; max-width: 900px; text-align: right;">
    <button class="btn-clean" onclick="cleanKeys()">[ DỌN DẸP KEY LỖI/HẾT HẠN ]</button>
</div>

<div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>Mã Key</th>
                <th>Phân Loại</th>
                <th>Người Dùng (ID)</th>
                <th>Trạng Thái</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div id="modal-overlay"></div>
<div id="h-modal">
    <div class="scan"></div>
    <p id="m-txt" style="font-size: 14px; margin: 20px 0;"></p>
    <button onclick="closeM()" style="font-size: 10px; padding: 5px 15px;">[ ĐÓNG ]</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("keys");

    function showM(t) {
        document.getElementById('m-txt').innerText = "> " + t;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('h-modal').style.display = 'block';
    }
    function closeM() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('h-modal').style.display = 'none';
    }

    function toggleDays() {
        const val = document.getElementById('typeIn').value;
        document.getElementById('daysBox').style.display = val.includes('TIME') ? 'block' : 'none';
    }

    async function addKey() {
        const k = document.getElementById('keyIn').value.trim().toUpperCase();
        const t = document.getElementById('typeIn').value;
        const d = parseInt(document.getElementById('daysIn').value);
        if(!k) return showM("CHƯA NHẬP TÊN KEY!");

        let data = { type: t, createdAt: firebase.database.ServerValue.TIMESTAMP };
        if(t.includes("ONCE")) data.used = false;
        if(t.includes("TIME")) data.expiresAt = Date.now() + (d * 86400000);

        await db.child(k).set(data);
        document.getElementById('keyIn').value = "";
        showM("ĐÃ PHÁT HÀNH KEY: " + k);
    }

    db.on('value', snap => {
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";
        const data = snap.val();
        if(!data) return updateStats(0,0,0);

        let count = 0, used = 0, exp = 0;
        for(let id in data) {
            count++;
            const item = data[id];
            let status = `<span class="badge bg-green">SẴN SÀNG</span>`;
            
            if(item.used === true) { status = `<span class="badge bg-red">ĐÃ DÙNG</span>`; used++; }
            if(item.expiresAt && Date.now() > item.expiresAt) { status = `<span class="badge bg-orange">HẾT HẠN</span>`; exp++; }

            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td style="color: var(--neon); font-weight: bold;">${id}</td>
                <td><small>${item.type}</small></td>
                <td>${item.owner || '-'}</td>
                <td>${status}</td>
                <td><button class="btn-del" onclick="db.child('${id}').remove()">[ XÓA ]</button></td>
            `;
            tbody.appendChild(tr);
        }
        updateStats(count, used, exp);
    });

    function updateStats(c, u, e) {
        document.getElementById('stat-total').innerText = c;
        document.getElementById('stat-used').innerText = u;
        document.getElementById('stat-expired').innerText = e;
    }

    function cleanKeys() {
        if(!confirm("XÓA TẤT CẢ KEY HẾT HẠN/ĐÃ DÙNG?")) return;
        db.once('value', s => {
            const data = s.val();
            for(let id in data) {
                if(data[id].used === true || (data[id].expiresAt && Date.now() > data[id].expiresAt)) {
                    db.child(id).remove();
                }
            }
            showM("ĐÃ DỌN DẸP HỆ THỐNG!");
        });
    }
</script>
</body>
    </html>
