<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Key Management</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px; color: #fff;
        }

        /* Giao diện tạo Key */
        .box {
            width: 100%; max-width: 400px; padding: 25px;
            border-radius: 20px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h3 { margin-bottom: 20px; text-align: center; letter-spacing: 1px; }

        input, select, button {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border-radius: 10px; border: none; outline: none;
        }

        input, select { background: rgba(255,255,255,0.2); color: #fff; }
        input::placeholder { color: #ccc; }
        select option { background: #203a43; }

        button { 
            background: #0a84ff; color: #fff; font-weight: bold; 
            cursor: pointer; transition: 0.3s; 
        }
        button:hover { background: #0066cc; transform: translateY(-2px); }

        /* Giao diện danh sách (History) */
        .history-box {
            width: 100%; max-width: 800px; background: rgba(0,0,0,0.3);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(10px);
        }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        th { color: #0a84ff; text-transform: uppercase; }

        .btn-delete {
            background: #ff453a; padding: 5px 10px; border-radius: 5px;
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:hover { background: #c0392b; }

        .status-used { color: #ff9f0a; }
        .status-active { color: #32d74b; }

        #msg { text-align: center; margin-top: 10px; font-weight: bold; }
        .success { color: #32d74b; }
        .error { color: #ff453a; }
    </style>
</head>

<body>

    <div class="box">
        <h3>TẠO KEY MỚI</h3>
        <input id="keyInput" placeholder="Nhập tên key (ví dụ: VIP123)">

        <select id="keyType" onchange="toggleDaysInput()">
            <option value="ONCE">1 Lần</option>
            <option value="TIME">Theo Ngày</option>
            <option value="INFINITE">Vĩnh Viễn</option>
            <option value="LOCKED_ONCE">1 Lần - 1 Thiết Bị</option>
            <option value="LOCKED_TIME">Theo Ngày - 1 Thiết Bị</option>
            <option value="LOCKED_INFINITE">Vĩnh Viễn - 1 Thiết Bị</option>
        </select>

        <input id="daysInput" type="number" placeholder="Số ngày sử dụng" style="display:none">

        <button onclick="createKey()">TẠO KEY</button>
        <div id="msg"></div>
    </div>

    <div class="history-box">
        <h3>DANH SÁCH KEY ĐÃ TẠO</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Loại</th>
                        <th>Trạng thái</th>
                        <th>Thiết bị (ID)</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="keyTableBody">
                    </tbody>
            </table>
        </div>
    </div>

<script>
// --- CẤU HÌNH FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
    databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("keys");

function toggleDaysInput() {
    const type = document.getElementById("keyType").value;
    document.getElementById("daysInput").style.display = (type.includes("TIME")) ? "block" : "none";
}

function normalizeKey(k) {
    return k.trim().toUpperCase().replace(/\s+/g, "");
}

// --- HÀM TẠO KEY ---
async function createKey() {
    const key = normalizeKey(document.getElementById("keyInput").value);
    const type = document.getElementById("keyType").value;
    const days = parseInt(document.getElementById("daysInput").value);
    const msg = document.getElementById("msg");

    if (!key) {
        msg.textContent = "Lỗi: Chưa nhập key!";
        msg.className = "error"; return;
    }

    let data = {
        type: type,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        device: null
    };

    if (type.includes("ONCE")) data.used = false;
    if (type.includes("TIME")) {
        if (!days || days <= 0) {
            msg.textContent = "Lỗi: Số ngày không hợp lệ!";
            msg.className = "error"; return;
        }
        data.expiresAt = Date.now() + days * 86400000;
    }

    try {
        await db.child(key).set(data);
        msg.textContent = "Thành công: Đã tạo " + key;
        msg.className = "success";
        document.getElementById("keyInput").value = ""; // Clear input
    } catch (e) {
        msg.textContent = "Lỗi server!";
        msg.className = "error";
    }
}

// --- HÀM LOAD LỊCH SỬ (Realtime) ---
function loadKeyHistory() {
    db.on('value', (snapshot) => {
        const tbody = document.getElementById("keyTableBody");
        tbody.innerHTML = ""; // Xóa danh sách cũ để render lại

        const allKeys = snapshot.val();
        if (!allKeys) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center'>Chưa có key nào</td></tr>";
            return;
        }

        for (let keyId in allKeys) {
            const info = allKeys[keyId];
            let statusText = "Khả dụng";
            let statusClass = "status-active";

            if (info.used === true) {
                statusText = "Đã dùng";
                statusClass = "status-used";
            } else if (info.expiresAt && Date.now() > info.expiresAt) {
                statusText = "Hết hạn";
                statusClass = "status-used";
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><b>${keyId}</b></td>
                <td>${info.type}</td>
                <td class="${statusClass}">${statusText}</td>
                <td>${info.device ? info.device : '<i>Chưa có</i>'}</td>
                <td><button class="btn-delete" onclick="deleteKey('${keyId}')">Xóa</button></td>
            `;
            tbody.appendChild(tr);
        }
    });
}

// --- HÀM XÓA KEY ---
async function deleteKey(keyId) {
    if (confirm("Bạn có chắc chắn muốn xóa key: " + keyId + "?")) {
        try {
            await db.child(keyId).remove();
            alert("Đã xóa key thành công!");
        } catch (e) {
            alert("Lỗi khi xóa!");
        }
    }
}

// Khởi chạy load dữ liệu khi mở trang
loadKeyHistory();
</script>

</body>
    </html>
