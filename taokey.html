<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN VDANN </title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --bg: #0a0a0a; }
        body { background: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace; padding: 20px; text-align: center; }
        .box { border: 1px solid var(--neon); padding: 20px; max-width: 500px; margin: 0 auto 20px; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        input, button { background: black; border: 1px solid var(--neon); color: var(--neon); padding: 10px; margin: 5px; outline: none; }
        button:hover { background: var(--neon); color: black; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid var(--neon); padding: 10px; font-size: 12px; }
        .status-ready { color: #00ff41; }
        .status-used { color: #ff3e3e; }
    </style>
</head>
<body>
    <h1>ADMIN DASHBOARD - KEY SYSTEM</h1>
    
    <div class="box">
        <h3>TẠO KEY MỚI</h3>
        <input type="number" id="days" placeholder="Số ngày (VD: 1)" value="1">
        <button onclick="createKey()">[ TẠO NGAY ]</button>
    </div>

    <div class="box">
        <h3>DANH SÁCH KEY</h3>
        <table>
            <thead>
                <tr>
                    <th>KEY</th>
                    <th>HẠN DÙNG</th>
                    <th>THIẾT BỊ</th>
                    <th>HÀNH ĐỘNG</th>
                </tr>
            </thead>
            <tbody id="keyTable"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIiLWiEDSnPGLqiUvxvGcCElljVGioW8I",
            authDomain: "vdann-app.firebaseapp.com",
            projectId: "vdann-app",
            storageBucket: "vdann-app.firebasestorage.app",
            messagingSenderId: "458475880895",
            appId: "1:458475880895:web:aa5f3193917e571d8d610a",
            databaseURL: "https://vdann-app-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Hàm tạo Key
        window.createKey = function() {
            const days = document.getElementById('days').value;
            const newKey = "KEY-VDANN-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            const expireTimestamp = Date.now() + (days * 24 * 60 * 60 * 1000);

            set(ref(db, 'AllKeys/' + newKey), {
                key: newKey,
                expires: expireTimestamp,
                hwid: "", // Trống để người dùng đầu tiên liên kết
                status: "active"
            }).then(() => alert("Đã tạo Key: " + newKey));
        };

        // Hàm xóa Key
        window.deleteKey = function(id) {
            if(confirm("Xóa Key này?")) remove(ref(db, 'AllKeys/' + id));
        };

        // Lấy danh sách Key thời gian thực
        onValue(ref(db, 'AllKeys'), (snapshot) => {
            const tbody = document.getElementById('keyTable');
            tbody.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val();
                const dateStr = new Date(data.expires).toLocaleString();
                const hwidDisplay = data.hwid ? `<span class="status-used">ĐÃ KHÓA</span>` : `<span class="status-ready">CHƯA DÙNG</span>`;
                
                tbody.innerHTML += `
                    <tr>
                        <td>${data.key}</td>
                        <td>${dateStr}</td>
                        <td>${hwidDisplay}</td>
                        <td><button onclick="deleteKey('${data.key}')">XÓA</button></td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
