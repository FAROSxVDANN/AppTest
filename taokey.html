<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - keyquocdat System</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0d0d0d; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1a1a1a; padding: 20px; border: 1px solid #0f0; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #0f0; color: #0f0; outline: none; border-radius: 5px; }
        button { cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #0f0; color: #000; }
        table { width: 100%; max-width: 800px; margin-top: 20px; border-collapse: collapse; background: #111; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; font-size: 13px; }
        th { color: #888; }
        .btn-del { background: #ff453a; color: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align: center;">KEY_MANAGER [NEW_DB]</h2>
    <input id="keyInput" placeholder="TÊN KEY (VD: VIP-01)">
    <select id="keyType" onchange="document.getElementById('daysBox').style.display = this.value.includes('TIME') ? 'block' : 'none'">
        <option value="ONCE">1 LẦN DÙNG</option>
        <option value="TIME">DÙNG THEO NGÀY</option>
        <option value="INFINITE">VĨNH VIỄN</option>
        <option value="LOCKED_ONCE">1 LẦN - KHÓA MÁY</option>
        <option value="LOCKED_TIME">NGÀY - KHÓA MÁY</option>
        <option value="LOCKED_INFINITE">VĨNH VIỄN - KHÓA MÁY</option>
    </select>
    <div id="daysBox" style="display:none;"><input id="daysInput" type="number" placeholder="SỐ NGÀY"></div>
    <button onclick="createKey()">PHÁT HÀNH KEY</button>
</div>

<table>
    <thead><tr><th>KEY</th><th>LOẠI</th><th>THIẾT BỊ</th><th>HÀNH ĐỘNG</th></tr></thead>
    <tbody id="tbody"></tbody>
</table>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("keys");

    async function createKey() {
        const k = document.getElementById("keyInput").value.trim().toUpperCase();
        const t = document.getElementById("keyType").value;
        const d = parseInt(document.getElementById("daysInput").value);
        if(!k) return alert("Nhập Key!");
        
        let data = { type: t, createdAt: firebase.database.ServerValue.TIMESTAMP };
        if(t.includes("ONCE")) data.used = false;
        if(t.includes("TIME") && d) data.expiresAt = Date.now() + (d * 86400000);

        await db.child(k).set(data);
        document.getElementById("keyInput").value = "";
        alert("Đã tạo: " + k);
    }

    db.on('value', snap => {
        const tbody = document.getElementById("tbody"); tbody.innerHTML = "";
        const data = snap.val(); if(!data) return;
        for(let id in data) {
            let tr = document.createElement("tr");
            tr.innerHTML = `<td>${id}</td><td>${data[id].type}</td><td>${data[id].device || '-'}</td>
            <td><button class="btn-del" onclick="db.child('${id}').remove()">XÓA</button></td>`;
            tbody.appendChild(tr);
        }
    });
</script>
</body>
</html>
