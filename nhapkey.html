<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDANN SEC - HỆ THỐNG XÁC THỰC</title>
    
    <style>
        :root { --hacker-green: #00ff41; --dark-bg: #000800; --error-red: #ff0000; }
        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { margin: 0; padding: 0; background-color: var(--dark-bg); overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }

        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.5; }

        /* Khung Terminal */
        .terminal-box { width: 95%; max-width: 420px; padding: 30px; background: rgba(0, 10, 0, 0.9); border: 1px solid var(--hacker-green); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); position: relative; z-index: 1; }
        .terminal-box::before { content: " "; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 4px, 3px 100%; pointer-events: none; }

        h3 { color: var(--hacker-green); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; font-size: 16px; text-align: center; }

        input { width: 100%; padding: 12px; background: rgba(0, 20, 0, 0.5); border: 1px solid #004400; color: var(--hacker-green); font-size: 14px; outline: none; margin-bottom: 15px; text-align: center; }
        input:focus { border-color: var(--hacker-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }

        button { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--hacker-green); color: var(--hacker-green); font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: var(--hacker-green); color: #000; box-shadow: 0 0 15px var(--hacker-green); }
        button:disabled { border-color: #333; color: #333; cursor: not-allowed; }

        #msg { margin-top: 15px; font-size: 12px; color: var(--hacker-green); opacity: 0.8; text-align: center; }

        /* Progress Bar */
        .progress-container { margin-top: 15px; height: 4px; border: 1px solid #003300; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--hacker-green); box-shadow: 0 0 10px var(--hacker-green); }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="terminal-box">
    <h3>> VDANN_SYSTEM_ACCESS</h3>
    
    <div id="sec-key">
        <input id="keyInput" placeholder="NHẬP MÃ TRUY CẬP VIP..." autocomplete="off">
        <button id="btnKey" onclick="accessSystem()">[ GIẢI MÃ & TRUY CẬP ]</button>
        
        <div class="progress-container" id="pCont">
            <div class="progress-bar" id="pBar"></div>
        </div>
        
        <div id="msg">root@vdann:~# awaiting_key...</div>
    </div>
</div>

<script type="module">
    // --- FIREBASE v10 CONFIG ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIiLWiEDSnPGLqiUvxvGcCElljVGioW8I",
        authDomain: "vdann-app.firebaseapp.com",
        projectId: "vdann-app",
        storageBucket: "vdann-app.firebasestorage.app",
        messagingSenderId: "458475880895",
        appId: "1:458475880895:web:aa5f3193917e571d8d610a",
        databaseURL: "https://vdann-app-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Hàm tạo mã định danh máy (HWID)
    function generateHWID() {
        return btoa(navigator.userAgent + screen.width + navigator.language).substring(0, 16);
    }

    // Gắn hàm vào window để gọi được từ button onclick
    window.accessSystem = function() {
        const key = document.getElementById('keyInput').value.trim();
        const msg = document.getElementById('msg');
        const pBar = document.getElementById('pBar');
        const pCont = document.getElementById('pCont');
        const btn = document.getElementById('btnKey');
        const myHWID = generateHWID();

        if(!key) {
            msg.innerText = "LỖI: VUI LÒNG NHẬP MÃ!";
            return;
        }

        // Hiệu ứng chạy thanh tiến trình cho "ngầu"
        btn.disabled = true;
        pCont.style.display = 'block';
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            pBar.style.width = progress + "%";
            msg.innerText = "ĐANG GIẢI MÃ: " + progress + "%";

            if(progress >= 100) {
                clearInterval(interval);
                verifyKey(key, myHWID);
            }
        }, 30);
    }

    function verifyKey(key, myHWID) {
        const msg = document.getElementById('msg');
        const btn = document.getElementById('btnKey');

        get(ref(db, 'AllKeys/' + key)).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                const now = Date.now();

                // 1. Kiểm tra hạn dùng
                if (now > data.expires) {
                    msg.innerText = "TRUY CẬP BỊ TỪ CHỐI: KEY HẾT HẠN!";
                    btn.disabled = false;
                    return;
                }

                // 2. Kiểm tra thiết bị (HWID)
                if (data.hwid === "") {
                    // Lần đầu dùng: Khóa HWID vào key này
                    update(ref(db, 'AllKeys/' + key), { hwid: myHWID }).then(() => {
                        msg.innerText = "KÍCH HOẠT THIẾT BỊ THÀNH CÔNG!";
                        setTimeout(() => window.location.href = "index.html", 1000);
                    });
                } else if (data.hwid === myHWID) {
                    // Đúng máy cũ
                    msg.innerText = "XÁC THỰC THÀNH CÔNG!";
                    setTimeout(() => window.location.href = "index.html", 1000);
                } else {
                    // Máy khác dùng key này
                    msg.innerText = "LỖI: KEY ĐÃ LIÊN KẾT VỚI MÁY KHÁC!";
                    btn.disabled = false;
                    alert("CẢNH BÁO: Thiết bị không trùng khớp!");
                }
            } else {
                msg.innerText = "LỖI: KEY KHÔNG TỒN TẠI TRÊN HỆ THỐNG!";
                btn.disabled = false;
            }
        }).catch(err => {
            msg.innerText = "LỖI KẾT NỐI HỆ THỐNG!";
            btn.disabled = false;
        });
    }

    // --- MATRIX EFFECT ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    setInterval(() => {
        ctx.fillStyle = 'rgba(0, 8, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0F0'; ctx.font = '15px monospace';
        drops.forEach((y, i) => {
            ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
        });
    }, 35);
</script>
</body>
</html>
