<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Security Portal</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        #matrix { position: fixed; top:0; left:0; z-index:1; opacity:0.3; }
        .box { position: relative; z-index: 2; width: 350px; background: rgba(10,10,10,0.95); border: 1px solid #0f0; border-radius: 15px; padding: 30px; box-shadow: 0 0 20px #0f03; }
        h2 { color: #0f0; text-align: center; font-size: 18px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #111; border: 1px solid #333; color: #0f0; outline: none; border-radius: 5px; }
        .btn { width: 100%; padding: 12px; background: transparent; border: 1px solid #0f0; color: #0f0; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .btn:hover { background: #0f0; color: #000; }
        .tabs { display: flex; border-bottom: 1px solid #222; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; color: #444; cursor: pointer; font-size: 12px; }
        .tab.active { color: #0f0; border-bottom: 2px solid #0f0; }
        #keyArea { display: none; text-align: center; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="box">
    <div id="authHeader">
        <div class="tabs">
            <div class="tab active" id="tL" onclick="tab('login')">LOGIN</div>
            <div class="tab" id="tR" onclick="tab('reg')">REGISTER</div>
        </div>
        <div id="loginForm">
            <input id="lU" placeholder="USERNAME">
            <input id="lP" type="password" placeholder="PASSWORD">
            <button class="btn" onclick="login()">[ EXECUTE ]</button>
        </div>
        <div id="regForm" style="display:none;">
            <input id="rU" placeholder="NEW USER">
            <input id="rP" type="password" placeholder="PASS">
            <button class="btn" onclick="register()">[ INITIALIZE ]</button>
        </div>
    </div>

    <div id="keyArea">
        <h2>LICENSE_REQUIRED</h2>
        <input id="keyIn" placeholder="ENTER ACCESS KEY">
        <button class="btn" onclick="verifyKey()">[ VERIFY ]</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Matrix Background
    const c = document.getElementById('matrix'); const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const drops = Array(Math.floor(c.width/16)).fill(1);
    setInterval(() => {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle = "#0f0"; drops.forEach((y, i) => {
            ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16);
            if(y*16 > c.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
        });
    }, 35);

    function getID() {
        let id = localStorage.getItem("did");
        if(!id) { id = "ID-"+Math.random().toString(36).substr(2,7).toUpperCase(); localStorage.setItem("did", id); }
        return id;
    }

    function tab(type) {
        document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
        document.getElementById('regForm').style.display = type === 'reg' ? 'block' : 'none';
        document.getElementById('tL').className = type === 'login' ? 'tab active' : 'tab';
        document.getElementById('tR').className = type === 'reg' ? 'tab active' : 'tab';
    }

    function register() {
        const u = document.getElementById('rU').value.trim();
        const p = document.getElementById('rP').value.trim();
        if(!u || !p) return;
        db.ref('users/'+u).once('value', s => {
            if(s.exists()) alert("Đã tồn tại!");
            else db.ref('users/'+u).set({p: p, d: getID()}).then(() => { alert("OK!"); tab('login'); });
        });
    }

    function login() {
        const u = document.getElementById('lU').value.trim();
        const p = document.getElementById('lP').value.trim();
        db.ref('users/'+u).once('value', s => {
            if(s.exists() && s.val().p === p) {
                localStorage.setItem("session", u);
                document.getElementById('authHeader').style.display = 'none';
                document.getElementById('keyArea').style.display = 'block';
            } else alert("Sai!");
        });
    }

    function verifyKey() {
        const k = document.getElementById('keyIn').value.trim().toUpperCase();
        const did = getID();
        db.ref('keys/'+k).transaction(data => {
            if(!data) return null;
            if(data.type.includes("LOCKED")) {
                if(!data.device) data.device = did;
                else if(data.device !== did) return undefined;
            }
            if(data.used && data.type.includes("ONCE")) return undefined;
            if(data.expiresAt && Date.now() > data.expiresAt) return undefined;
            if(data.type.includes("ONCE")) data.used = true;
            return data;
        }, (err, ok, snap) => {
            if(ok && snap.exists()) { alert("ACCESS GRANTED!"); window.location.href="index.html"; }
            else alert("KEY LỖI/HẾT HẠN/SAI MÁY!");
        });
    }

    window.onload = () => { if(localStorage.getItem("session")) { document.getElementById('authHeader').style.display='none'; document.getElementById('keyArea').style.display='block'; } };
</script>
</body>
                                                                 </html>
