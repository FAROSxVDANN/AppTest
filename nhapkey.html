<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG BẢO MẬT | QUOCDAT SEC</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root { --neon: #00ff41; --error: #ff3e3e; --glass: rgba(5, 5, 5, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { background: #000; color: var(--neon); font-family: 'Share Tech Mono', monospace; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }

        /* Khung chính */
        .box { position: relative; z-index: 10; width: 90%; max-width: 400px; background: var(--glass); border: 1px solid var(--neon); border-radius: 4px; padding: 30px; box-shadow: 0 0 20px rgba(0,255,65,0.2); transition: 0.3s; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        h2 { font-family: 'Orbitron'; font-size: 16px; text-align: center; margin-bottom: 25px; letter-spacing: 2px; text-shadow: 0 0 8px var(--neon); text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid var(--neon); color: var(--neon); outline: none; font-family: 'Share Tech Mono'; font-size: 14px; }
        input::placeholder { color: rgba(0, 255, 65, 0.3); }
        
        .options { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 20px; }
        .chk-container { display: flex; align-items: center; cursor: pointer; color: var(--neon); }
        .chk-container input { width: auto; margin-right: 8px; margin-bottom: 0; accent-color: var(--neon); }
        .forgot-link { color: #888; text-decoration: underline; cursor: pointer; }
        .forgot-link:hover { color: var(--neon); }

        .btn { width: 100%; padding: 13px; background: transparent; border: 1px solid var(--neon); color: var(--neon); font-family: 'Orbitron'; font-weight: bold; cursor: pointer; margin-top: 5px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }

        .tabs { display: flex; margin-bottom: 20px; border: 1px solid #333; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 11px; cursor: pointer; background: #050505; color: #555; transition: 0.3s; }
        .tab.active { background: var(--neon); color: #000; font-weight: bold; }

        /* HACKER MODAL (Thay thế Alert lỏ) */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 999; }
        #hacker-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); z-index: 1000; width: 320px; background: #050505; border: 2px solid var(--neon); box-shadow: 0 0 30px rgba(0, 255, 65, 0.4); padding: 25px; text-align: center; opacity: 0; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        #hacker-modal.active { display: block; transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .modal-scanner { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon); animation: modalScan 2s linear infinite; }
        @keyframes modalScan { 0% { top: 0; } 100% { top: 100%; } }
        #modal-text { font-size: 14px; margin: 15px 0; line-height: 1.5; min-height: 40px; }

        #keyArea { display: none; }
        .footer-link { text-align: center; font-size: 10px; margin-top: 20px; cursor: pointer; opacity: 0.5; color: #fff; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="modal-overlay" onclick="closeHackerModal()"></div>
<div id="hacker-modal">
    <div class="modal-scanner"></div>
    <div style="font-size: 9px; color: #555; text-align: left; margin-bottom: 10px;">[ THÔNG BÁO HỆ THỐNG ]</div>
    <div id="modal-text">> ĐANG KHỞI CHẠY...</div>
    <button class="btn" style="padding: 8px; font-size: 10px;" onclick="closeHackerModal()">[ ĐÃ HIỂU ]</button>
</div>

<div class="box" id="mainBox">
    <div id="authHeader">
        <div class="tabs">
            <div id="tL" class="tab active" onclick="tab('login')">ĐĂNG NHẬP</div>
            <div id="tR" class="tab" onclick="tab('reg')">ĐĂNG KÝ</div>
        </div>
        
        <div id="loginForm">
            <input id="lU" placeholder="> TÊN ĐĂNG NHẬP">
            <input id="lP" type="password" placeholder="> MẬT KHẨU">
            <div class="options">
                <label class="chk-container"><input type="checkbox" id="rememberMe"> TỰ ĐỘNG VÀO</label>
                <span class="forgot-link" onclick="thongBao('VUI LÒNG LIÊN HỆ ADMIN ĐỂ RESET!')">QUÊN PASS?</span>
            </div>
            <button class="btn" onclick="login()">[ ĐĂNG NHẬP ]</button>
        </div>

        <div id="regForm" style="display:none;">
            <input id="rU" placeholder="> TÊN TÀI KHOẢN MỚI">
            <input id="rP" type="password" placeholder="> MẬT KHẨU MỚI">
            <button class="btn" onclick="register()">[ KHỞI TẠO ]</button>
        </div>
    </div>

    <div id="keyArea">
        <h2>XÁC THỰC KEY</h2>
        <input id="keyIn" placeholder="> NHẬP MÃ TRUY CẬP">
        <button class="btn" onclick="verifyKey()">[ GIẢI MÃ & VÀO ]</button>
        <p class="footer-link" onclick="logout()">[ THOÁT TÀI KHOẢN ]</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Hiệu ứng Thông báo Hacker
    function thongBao(text) {
        const overlay = document.getElementById('modal-overlay');
        const modal = document.getElementById('hacker-modal');
        const textEl = document.getElementById('modal-text');
        
        overlay.style.display = 'block';
        modal.classList.add('active');
        
        // Hiệu ứng chữ chạy
        textEl.innerText = "";
        let i = 0;
        const txt = "> " + text;
        function typeWriter() {
            if (i < txt.length) {
                textEl.innerText += txt.charAt(i);
                i++;
                setTimeout(typeWriter, 30);
            }
        }
        typeWriter();
    }

    function closeHackerModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('hacker-modal').classList.remove('active');
    }

    // Matrix Rain
    const c = document.getElementById('matrix'); const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const drops = Array(Math.floor(c.width/16)).fill(1);
    setInterval(() => {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle = "#0f0"; drops.forEach((y, i) => {
            ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16);
            if(y*16 > c.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
        });
    }, 35);

    function triggerShake() {
        const box = document.getElementById('mainBox');
        box.classList.add('shake');
        setTimeout(() => box.classList.remove('shake'), 400);
    }

    function tab(type) {
        document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
        document.getElementById('regForm').style.display = type === 'reg' ? 'block' : 'none';
        document.getElementById('tL').className = type === 'login' ? 'tab active' : 'tab';
        document.getElementById('tR').className = type === 'reg' ? 'tab active' : 'tab';
    }

    function register() {
        const u = document.getElementById('rU').value.trim();
        const p = document.getElementById('rP').value.trim();
        if(!u || !p) return triggerShake();
        db.ref('users/'+u).once('value', s => {
            if(s.exists()) { triggerShake(); thongBao("TÀI KHOẢN ĐÃ TỒN TẠI!"); }
            else db.ref('users/'+u).set({p: p}).then(() => { thongBao("ĐĂNG KÝ THÀNH CÔNG!"); tab('login'); });
        });
    }

    function login() {
        const u = document.getElementById('lU').value.trim();
        const p = document.getElementById('lP').value.trim();
        if(!u || !p) return triggerShake();
        db.ref('users/'+u).once('value', s => {
            if(s.exists() && s.val().p === p) {
                if(document.getElementById('rememberMe').checked) localStorage.setItem("auto", "1");
                localStorage.setItem("session", u);
                showKey();
                thongBao("ĐĂNG NHẬP THÀNH CÔNG!");
            } else { triggerShake(); thongBao("SAI TÀI KHOẢN HOẶC MẬT KHẨU!"); }
        });
    }

    function showKey() { document.getElementById('authHeader').style.display='none'; document.getElementById('keyArea').style.display='block'; }

    function verifyKey() {
        const k = document.getElementById('keyIn').value.trim().toUpperCase();
        const user = localStorage.getItem("session");
        if(!k) return triggerShake();
        db.ref('keys/'+k).transaction(data => {
            if(!data) return null;
            if(data.type && data.type.includes("LOCKED")) {
                if(!data.owner) data.owner = user;
                else if(data.owner !== user) return undefined;
            }
            if(data.used && data.type.includes("ONCE")) return undefined;
            if(data.expiresAt && Date.now() > data.expiresAt) return undefined;
            if(data.type.includes("ONCE")) data.used = true;
            return data;
        }, (err, ok, snap) => {
            if(ok && snap.exists()) { thongBao("KEY HỢP LỆ! ĐANG VÀO..."); setTimeout(()=>window.location.href="index.html", 1500); }
            else { triggerShake(); thongBao("KEY KHÔNG HỢP LỆ HOẶC ĐÃ HẾT HẠN!"); }
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
    window.onload = () => { if(localStorage.getItem("session") && localStorage.getItem("auto")) showKey(); };
</script>
</body>
</html>
