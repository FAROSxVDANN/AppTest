<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacker System - Verify Key</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
/* Reset & Base */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #000;
    overflow: hidden; /* Ẩn thanh cuộn để hiệu ứng canvas đẹp hơn */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace; /* Font kiểu máy tính cổ điển */
}

/* Hiệu ứng Matrix Canvas */
#matrix-canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
}

/* Hộp xác minh phong cách Terminal */
.hacker-box {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 400px;
    padding: 40px 30px;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #0f0;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    text-align: center;
}

h3 {
    color: #0f0;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 25px;
    text-shadow: 0 0 10px #0f0;
    font-size: 1.5rem;
}

/* Input phong cách Command Line */
input {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    background: transparent;
    border: 1px solid #0f0;
    color: #0f0;
    font-size: 18px;
    text-align: center;
    outline: none;
    transition: all 0.3s;
}

input:focus {
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
    background: rgba(0, 255, 0, 0.05);
}

/* Button phong cách Retro */
button {
    width: 100%;
    padding: 15px;
    border: 1px solid #0f0;
    background: transparent;
    color: #0f0;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}

button:hover {
    background: #0f0;
    color: #000;
    box-shadow: 0 0 20px #0f0;
}

button:active { transform: scale(0.95); }
button:disabled { border-color: #050; color: #050; cursor: not-allowed; }

/* Progress Bar kiểu Terminal */
.progress-container {
    margin-top: 20px;
    height: 10px;
    border: 1px solid #0f0;
    display: none;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #0f0;
    box-shadow: 0 0 10px #0f0;
}

#msg {
    margin-top: 20px;
    font-size: 14px;
    color: #0f0;
    text-transform: uppercase;
    min-height: 20px;
}

/* Trạng thái thông báo */
.success { color: #0f0 !important; text-shadow: 0 0 10px #0f0; }
.error { color: #f00 !important; border-color: #f00 !important; text-shadow: 0 0 10px #f00; }

/* Hiệu ứng nhấp nháy cho text */
.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }
</style>
</head>

<body>

<canvas id="matrix-canvas"></canvas>

<div class="hacker-box">
    <h3>> SYSTEM_ACCESS</h3>
    <input id="keyInput" placeholder="ENTER ACCESS KEY..." autocomplete="off">
    <button id="btnVerify" onclick="startVerify()">[ EXECUTE ]</button>

    <div class="progress-container" id="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div id="msg" class="blink">AWAITING INPUT...</div>
</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
    databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("keys");

// --- DEVICE ID ---
function getDeviceId() {
    let id = localStorage.getItem("deviceId");
    if (!id) {
        id = "DEV-" + Math.random().toString(36).substr(2, 9);
        localStorage.setItem("deviceId", id);
    }
    return id;
}

// --- VERIFY START ---
function startVerify() {
    const box = document.querySelector('.hacker-box'); // Lấy box để rung
    const keyInput = document.getElementById("keyInput");
    const key = keyInput.value.trim().toUpperCase().replace(/\s+/g, "");
    const msg = document.getElementById("msg");
    const bar = document.getElementById("bar");
    const progress = document.getElementById("progress");
    const btn = document.getElementById("btnVerify");

    // Xóa hiệu ứng rung cũ nếu có
    box.classList.remove('shake');

    // Kiểm tra nếu key trống
    if (!key) {
        msg.textContent = "> ERROR: KEY REQUIRED!";
        msg.className = "error";
        
        // Kích hoạt hiệu ứng rung
        void box.offsetWidth; // Thủ thuật nhỏ để reset animation
        box.classList.add('shake'); 
        return;
    }

    // Bắt đầu quá trình "Hack" giả lập
    btn.disabled = true;
    keyInput.disabled = true;
    
    bar.style.width = "0%";
    progress.style.display = "block";
    msg.textContent = "> DECRYPTING DATA...";
    msg.className = "blink"; // Cho chữ nhấp nháy khi đang giải mã

    let percent = 0;
    const interval = setInterval(() => {
        percent += 5;
        bar.style.width = percent + "%";

        if (percent >= 100) {
            clearInterval(interval);
            // Sau khi chạy xong thanh bar thì mới kiểm tra Database
            verifyKeyInDatabase(key, msg, btn);
        }
    }, 30);
}

// --- VERIFY LOGIC FULL ---
function verifyKeyInDatabase(key, msg, btn) {
    const ref = db.child(key);
    const deviceId = getDeviceId();

    ref.transaction((data) => {

        if (!data) return null;

        // ===== KEY KHÓA THIẾT BỊ =====
        if (data.type && data.type.startsWith("LOCKED")) {

            // gán device nếu chưa có
            if (!data.device) {
                data.device = deviceId;
            }

            // sai thiết bị
            if (data.device !== deviceId) {
                return;
            }

            // 1 lần
            if (data.type.includes("ONCE")) {
                if (data.used === true) return;
                data.used = true;
            }

            // có hạn
            if (data.type.includes("TIME")) {
                if (Date.now() > data.expiresAt) return;
            }

            return data;
        }

        // ===== KEY THƯỜNG =====
        if (data.type === "ONCE") {
            if (data.used === true) return;
            data.used = true;
            return data;
        }

        if (data.type === "TIME") {
            if (Date.now() > data.expiresAt) return;
            return data;
        }

        if (data.type === "INFINITE") {
            return data;
        }

        return;

    }, (error, committed, snapshot) => {

        btn.disabled = false;
        document.getElementById("keyInput").disabled = false;

        if (error) {
            msg.textContent = "> SERVER ERROR!";
            msg.className = "error";
        } 
        else if (!snapshot.exists()) {
            msg.textContent = "> KEY NOT FOUND!";
            msg.className = "error";
        } 
        else if (!committed) {
            msg.textContent = "> INVALID / USED / WRONG DEVICE!";
            msg.className = "error";
        } 
        else {
            msg.textContent = "> ACCESS GRANTED! REDIRECTING...";
            msg.className = "success";

            localStorage.setItem("userVerified", "true");

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1000);
        }

    });
}

// ENTER KEY
document.getElementById("keyInput").addEventListener("keypress", e => {
    if (e.key === "Enter") startVerify();
});

// RESIZE CANVAS
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
// --- MATRIX RAIN EFFECT ---
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Các ký tự sẽ rơi (có thể thay đổi thành số 0-1 nếu muốn kiểu nhị phân)
const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
const fontSize = 16;
const columns = canvas.width / fontSize;

// Khởi tạo mảng vị trí y cho mỗi cột
const drops = [];
for (let x = 0; x < columns; x++) {
    drops[x] = 1;
}

// Biến điều khiển tốc độ/màu sắc nếu bạn muốn thay đổi lúc thành công
let matrixSpeed = 35;
let matrixColor = "#0f0"; 

function drawMatrix() {
    // Tạo lớp phủ mờ màu đen để tạo hiệu ứng vệt mờ (trail)
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = matrixColor; // Sử dụng biến để có thể đổi màu khi Access Granted
    ctx.font = fontSize + "px Courier New";

    for (let i = 0; i < drops.length; i++) {
        const text = characters.charAt(Math.floor(Math.random() * characters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

// Hàm khởi tạo loop
let matrixInterval = setInterval(drawMatrix, matrixSpeed);

// Cập nhật hàm createKey để tương tác với Matrix
async function createKey() {
    const keyInput = document.getElementById("keyInput");
    const key = normalizeKey(keyInput.value);
    const type = document.getElementById("keyType").value;
    const days = parseInt(document.getElementById("daysInput").value);
    const msg = document.getElementById("msg");

    if (!key) {
        msg.textContent = "> ERROR: KEY REQUIRED!";
        msg.className = "error"; 
        return;
    }

    keyInput.disabled = true;

    let data = {
        type: type,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        device: null
    };

    if (type.includes("ONCE")) data.used = false;
    if (type.includes("TIME")) {
        if (!days || days <= 0) {
            msg.textContent = "> ERROR: INVALID DURATION!";
            msg.className = "error";
            keyInput.disabled = false;
            return;
        }
        data.expiresAt = Date.now() + days * 86400000;
    }

    try {
        await db.child(key).set(data);

        // HIỆU ỨNG KHI THÀNH CÔNG:
        matrixColor = "#00ffcc"; // Đổi sang màu xanh lơ sáng cho hiện đại
        msg.textContent = `> KEY [${key}] CREATED! REDIRECTING...`;
        msg.className = "success";
        
        localStorage.setItem("userVerified", "true");

        // Tăng tốc độ rơi của Matrix để tạo cảm giác "vượt rào" thành công
        clearInterval(matrixInterval);
        matrixInterval = setInterval(drawMatrix, 15); 

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        msg.textContent = "> SERVER CRITICAL ERROR!";
        msg.className = "error";
        keyInput.disabled = false;
    }
}
// Chạy vòng lặp hiệu ứng
setInterval(drawMatrix, 35);
</script>
